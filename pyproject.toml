[project]
name = "iust-mail"
version = "0.1.0"
description = "Forward new IUST Exchange emails to Telegram"
readme = "README.md"
authors = [
    { name = "Seyed Ali Kamali Pargoo", email = "seyedalikamali1381@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "exchangelib>=5.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
iust-mail = "iust_mail:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
